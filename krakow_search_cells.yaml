# Search circles for ``scraper_api.py --cells-file krakow_search_cells.yaml``.
#
# Smaller circles (~1.6–2.0 km) + more centres → different top-20 rankings per
# request, so you surface more unique businesses than a few large disks.
#
# Optional ``name`` is written to the CSV ``area`` column (human-readable).
# If omitted, ``id`` with underscores → spaces is used.
#
# Run all cells (deduped ``place_id``, one CSV; overlapping cells merge ``area``):
#   python scraper_api.py --cells-file krakow_search_cells.yaml
#   → default 26 types × 34 cells = 884 Nearby API calls (with bundled file).
#
# Comment out any ``- id:`` block to skip that cell.

